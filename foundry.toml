[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]

[rpc_endpoints]
elysium = "https://testnet-rpc.elysium.kinetiq.xyz"

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64

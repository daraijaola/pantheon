name: Web regression

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: WalletConnect attempt lifecycle (PR 11)
        run: node --experimental-strip-types --test src/lib/wallet-connect-attempt.test.ts
      - name: Production-build browser regressions
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
          retention-days: 14
